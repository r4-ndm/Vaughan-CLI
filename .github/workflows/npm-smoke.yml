# Install the PUBLISHED npm packages on every supported platform and run them.
# The release job proves the tarballs were built and checksummed; only this
# proves `npm i vaughan` yields a binary that starts on that OS/CPU.
# Manual only: it tests whatever is on the registry, so it must not gate pushes.
name: npm smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to install (e.g. 0.2.8); blank = latest"
        required: false
        default: ""

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install from the registry and run
        shell: bash
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"; cd "$dir"
          npm init -y >/dev/null
          spec="vaughan${WANT:+@$WANT}"
          # A fresh publish is invisible for several minutes (npm "is being processed"), and the
          # launcher can resolve before ITS platform package does: `npm i` then succeeds with an
          # UNMET optional dependency. Retry until the platform package is actually installed.
          plat="vaughan-$(node -p "process.platform + '-' + process.arch")"
          for i in $(seq 1 16); do
            rm -rf node_modules package-lock.json
            npm i "$spec" --prefer-online --no-audit --no-fund \
              && node -e "require.resolve('$plat/package.json')" 2>/dev/null && break
            echo "retry $i: $plat not installable yet"; sleep 30
          done
          node -e "require.resolve('$plat/package.json')"
          npm ls --all
          out="$(npx --no-install vaughan --version)"
          echo "vaughan: $out"
          mcp="$(npx --no-install vaughan-mcp --version)"
          echo "vaughan-mcp: $mcp"
          if [ -n "$WANT" ]; then
            case "$out" in *"$WANT"*) ;; *) echo "version mismatch: wanted $WANT"; exit 1;; esac
          fi
          bin="$(node -p "require.resolve('vaughan-' + process.platform + '-' + process.arch + '/package.json')")"
          file "$(dirname "$bin")/bin/vaughan"
