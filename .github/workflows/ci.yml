# Format, lint, and test on every push and pull request.
#
# Foundry/Anvil is required: many vaughan-tui / vaughan-cli / vaughan-core
# bomb-proof suites spawn `anvil`. Without it those tests panic and CI would
# be a false green if we skipped them — so we install Foundry explicitly.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: newer anvil replies to eth_sendTransaction before mining,
          # which races the Anvil tests' send-then-read checks (see TASKS.md).
          version: v1.2.1

      - name: Verify anvil on PATH
        run: anvil --version

      # One gate, same as the one developers run locally: fmt, clippy, tests,
      # tracked-file hygiene, secrets scan, and the default-build railgun leak
      # check. Railgun clippy lives in the dedicated job below, which is the only
      # place allowed to compile that stack.
      #
      # cargo audit runs in the gate. Two advisories are accepted risk and listed
      # with reasons in .cargo/audit.toml — anything new fails here.
      - name: audit gate
        run: scripts/audit.sh --with-tests --skip-railgun

  # Opt-in RAILGUN stack (docs/railgun-go-no-go.md). Separate job so the default
  # build above never compiles railgun-rust.
  railgun:
    name: railgun feature · upstream parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: railgun

      - name: cargo clippy (railgun)
        run: cargo clippy -p vaughan-railgun -p vaughan-tui -p vaughan-cli --features vaughan-railgun/enabled,vaughan-cli/railgun --all-targets -- -D warnings

      - name: cargo test (railgun)
        run: |
          cargo test -p vaughan-railgun --features enabled
          cargo test -p vaughan-tui --features railgun --lib views::shield
          cargo test -p vaughan-tui --features railgun --lib provider

      - name: Upstream parity tests under Vaughan's lockfile
        run: scripts/railgun-parity.sh
