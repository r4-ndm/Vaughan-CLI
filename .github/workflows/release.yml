# Build release tarballs for the unified `vaughan` binary and attach them to
# GitHub Releases. Tag with v* (e.g. v0.1.0) to publish.
#
# Artifacts:
#   vaughan-linux-x86_64.tar.gz
#   vaughan-linux-aarch64.tar.gz
#   vaughan-macos-x86_64.tar.gz
#   vaughan-macos-aarch64.tar.gz
#   SHA256SUMS

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-13
            target: macos-x86_64
          - runner: macos-latest
            target: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build release binary
        run: cargo build --release -p vaughan-cli

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/release/vaughan dist/
          tar -czf "vaughan-${{ matrix.target }}.tar.gz" -C dist vaughan
          sha256sum "vaughan-${{ matrix.target }}.tar.gz" >> SHA256SUMS.partial

      - uses: actions/upload-artifact@v4
        with:
          name: vaughan-${{ matrix.target }}
          path: |
            vaughan-${{ matrix.target }}.tar.gz
            SHA256SUMS.partial

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksum file
        run: |
          find artifacts -name 'SHA256SUMS.partial' -exec cat {} \; | sort -u > SHA256SUMS
          find artifacts -name 'vaughan-*.tar.gz' -exec cp {} . \;
          cat SHA256SUMS
          ls -la vaughan-*.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vaughan-*.tar.gz
            SHA256SUMS
