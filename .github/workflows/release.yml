# Build release tarballs for the unified `vaughan` binary and attach them to
# GitHub Releases. Tag with v* (e.g. v0.1.0) to publish.
#
# Artifacts:
#   vaughan-linux-x86_64.tar.gz
#   vaughan-linux-aarch64.tar.gz
#   vaughan-macos-aarch64.tar.gz
#   SHA256SUMS
#
# Intel macOS (x86_64) is omitted — GitHub's Intel runners are deprecated and
# queue indefinitely. Apple Silicon users get macos-aarch64; Intel Macs can run
# that binary under Rosetta or build from source.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-latest
            target: macos-aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build release binary
        run: cargo build --release -p vaughan-cli

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/release/vaughan dist/
          tar -czf "vaughan-${{ matrix.target }}.tar.gz" -C dist vaughan
          sha256sum "vaughan-${{ matrix.target }}.tar.gz" >> "SHA256SUMS.${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vaughan-${{ matrix.target }}
          path: |
            vaughan-${{ matrix.target }}.tar.gz
            SHA256SUMS.${{ matrix.target }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksum file
        run: |
          find artifacts -name 'SHA256SUMS.*' -exec cat {} \; | sort -u > SHA256SUMS
          find artifacts -name 'vaughan-*.tar.gz' -exec cp {} . \;
          cat SHA256SUMS
          ls -la vaughan-*.tar.gz

          line_count=$(wc -l < SHA256SUMS | tr -d '[:space:]')
          if [ "$line_count" -ne 3 ]; then
            echo "ERROR: SHA256SUMS has $line_count lines; expected exactly 3" >&2
            exit 1
          fi

          tarball_count=0
          for f in vaughan-*.tar.gz; do
            [ -e "$f" ] || continue
            tarball_count=$((tarball_count + 1))
            if ! grep -q "[[:space:]]${f}$" SHA256SUMS; then
              echo "ERROR: Tarball $f has no matching entry in SHA256SUMS" >&2
              exit 1
            fi
          done
          if [ "$tarball_count" -ne 3 ]; then
            echo "ERROR: Expected 3 tarballs, found $tarball_count" >&2
            exit 1
          fi

          sha256sum -c SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vaughan-*.tar.gz
            SHA256SUMS
