# Build release tarballs for the unified `vaughan` binary and attach them to
# GitHub Releases. Tag with v* (e.g. v0.1.0) to publish.
#
# Artifacts:
#   vaughan-linux-x86_64.tar.gz
#   vaughan-linux-aarch64.tar.gz
#   vaughan-macos-aarch64.tar.gz
#   SHA256SUMS
#
# Intel macOS (x86_64) is omitted — GitHub's Intel runners are deprecated and
# queue indefinitely. Apple Silicon users get macos-aarch64; Intel Macs can run
# that binary under Rosetta or build from source.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-latest
            target: macos-aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build release binary
        run: cargo build --release -p vaughan-cli

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/release/vaughan dist/
          tar -czf "vaughan-${{ matrix.target }}.tar.gz" -C dist vaughan
          sha256sum "vaughan-${{ matrix.target }}.tar.gz" >> "SHA256SUMS.${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vaughan-${{ matrix.target }}
          path: |
            vaughan-${{ matrix.target }}.tar.gz
            SHA256SUMS.${{ matrix.target }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksum file
        env:
          EXPECTED_ASSETS: |
            vaughan-linux-x86_64.tar.gz
            vaughan-linux-aarch64.tar.gz
            vaughan-macos-aarch64.tar.gz
        run: |
          echo "Matched checksum partials:"
          find artifacts -name 'SHA256SUMS.*' -print
          find artifacts -name 'SHA256SUMS.*' -exec cat {} + | sort -u > SHA256SUMS
          find artifacts -name 'vaughan-*.tar.gz' -exec cp {} . \;

          expected_list=$(echo "$EXPECTED_ASSETS" | sed '/^[[:space:]]*$/d')
          expected_count=$(echo "$expected_list" | wc -l | tr -d '[:space:]')

          line_count=$(wc -l < SHA256SUMS | tr -d '[:space:]')
          if [ "$line_count" -ne "$expected_count" ]; then
            echo "ERROR: SHA256SUMS has $line_count lines; expected exactly $expected_count" >&2
            exit 1
          fi

          tarball_count=0
          for f in vaughan-*.tar.gz; do
            [ -e "$f" ] || continue
            tarball_count=$((tarball_count + 1))
          done
          if [ "$tarball_count" -ne "$expected_count" ]; then
            echo "ERROR: Expected $expected_count tarballs in working directory, found $tarball_count" >&2
            exit 1
          fi

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if [ ! -f "$asset" ]; then
              echo "ERROR: Expected asset $asset not found in working directory" >&2
              exit 1
            fi
            if ! grep -q "[[:space:]]${asset}$" SHA256SUMS; then
              echo "ERROR: Expected asset $asset has no matching entry in SHA256SUMS" >&2
              exit 1
            fi
          done <<< "$expected_list"

          sha256sum -c SHA256SUMS

          cat SHA256SUMS
          ls -la vaughan-*.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            vaughan-*.tar.gz
            SHA256SUMS

  # npm publish via Trusted Publishing (OIDC): no token, no 2FA prompt.
  #
  # It is OFF until the npm side is configured, because a missing trusted
  # publisher makes this job fail with a misleading 404. To enable:
  #   1. npmjs.com -> vaughan-mcp -> Settings -> Trusted Publisher -> GitHub Actions
  #      repository: r4-ndm/Vaughan-CLI   workflow filename: release.yml
  #      (casing is validated against the OIDC token; it must match exactly)
  #   2. GitHub repo -> Settings -> Variables -> Actions -> new variable
  #      NPM_TRUSTED_PUBLISH = true
  #   3. then delete any bypass-2FA token from ~/.npmrc and npmjs.com
  publish-npm:
    name: publish npm package
    needs: release
    if: vars.NPM_TRUSTED_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 (OIDC exchange + provenance).
      - name: Upgrade npm for OIDC publishing
        run: npm install -g npm@^11.15.0

      - name: Verify the package version matches the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          have="$(node -p "require('./npm/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "ERROR: tag is $tag but npm/package.json is $have — bump the version before tagging" >&2
            exit 1
          fi

      - name: Publish to npm (trusted publishing)
        working-directory: npm
        run: npm publish --access public
