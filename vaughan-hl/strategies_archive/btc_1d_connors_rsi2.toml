name = "BTC 1d — Connors RSI-2 Mean Reversion (200 EMA filter, 5 SMA exit)"

[market]
coin = "BTC"
interval = "1d"
leverage = 5
is_cross = false
direction = "long_only"

[sizing]
mode = "risk_pct"
risk_pct = 1.0
initial_equity_usd = 1000.0

[indicators]
# Connors uses RSI(2): a fast oversold reading inside an uptrend.
rsi = { period = 2, ma_period = 14, ma_type = "sma" }
# Proxy for the 200-period MA trend filter (engine exposes EMA, not SMA, for this).
ema_trend = { period = 200 }
# bollinger period = 5 makes bb_middle the 5-period SMA of price used by the exit rule.
bollinger = { period = 5, std_dev = 2.0 }
atr = { period = 14 }

# Entry: market is above its 200-period MA and 2-period RSI is deeply oversold.
[entry.long]
all = [
    "close > ema_trend",
    "rsi < 5.0",
]

# No short side in the original system.
[entry.short]
all = []

[exit]
# Disaster stop only — the real exit is the 5-period SMA cross below.
stop_loss = { kind = "atr", multiplier = 3.0, min_stop_bps = 150, max_stop_bps = 1000 }
# Far target so the signal exit, not the R:R target, closes the trade.
take_profit_rr = 10.0
cooldown_bars = 1
long_exit_any = [
    "close crosses_above bb_middle",
]
