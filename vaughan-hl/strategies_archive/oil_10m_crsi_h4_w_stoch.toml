name = "WTI Crude Oil (xyz:CL) 10m — Connors RSI extremes + H4 + weekly StochRSI filters"

[market]
coin = "xyz:CL"
interval = "10m"
leverage = 50
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 6.9
initial_equity_usd = 1000.0

# UK local time (BST/GMT handled from bar timestamps). Entries are only taken
# on bars that OPEN inside this window; the end is exclusive.
[session]
start = "05:00"
end = "23:00"

[indicators]
connors_rsi = { rsi_period = 3, streak_period = 2, rank_period = 100 }
atr = { period = 14 }

# Higher-timeframe filter: StochRSI computed on 4h bars resampled from this 5m
# chart, stepped in only once each 4h bar closes (no look-ahead).
[indicators.htf]
interval = "4h"
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }

# Second higher-timeframe filter: StochRSI on WEEKLY bars ("big filter"), built
# from the 1d candle series because ~29 weekly closes cannot be resampled from a
# chart that spans a couple of weeks.
[indicators.htf2]
interval = "1w"
source = "1d"
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }

[entry]
# Per trading window (UK calendar day): hard cap on entries, and stop trading
# the rest of the day once this many losing trades have closed.
max_trades_per_window = 3
max_losses_per_window = 2

# Long: Connors RSI oversold while H4 StochRSI has crossed bullish (%K above
# %D) and is still rising on the latest closed 4h bar (%K slope > 0), below the
# 50 centre line. This is the "crossed and rising" state, so any 5m bar inside
# that 4h regime can trigger instead of only the one bar that closes the 4h.
[entry.long]
all = [
    "connors_rsi < 20.0",
    "htf_stoch_k > htf_stoch_d",
    "htf_stoch_k_slope > 0.0",
    "htf_stoch_k < 50.0",
    "htf2_stoch_k > htf2_stoch_d",
]

# Short: mirror image — Connors RSI overbought, H4 StochRSI crossed bearish
# (%K below %D) and still falling, above the 50 centre line.
[entry.short]
all = [
    "connors_rsi > 80.0",
    "htf_stoch_k < htf_stoch_d",
    "htf_stoch_k_slope < 0.0",
    "htf_stoch_k > 50.0",
    "htf2_stoch_k < htf2_stoch_d",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.0, min_stop_bps = 25, max_stop_bps = 105 }
# No partial: at +3R the stop trails to breakeven and the FULL position rides to
# the 3.69R target, so every trade resolves as a stop near −1R, a breakeven stop
# just under 3R, or the full target (close_pct = 0 closes nothing).
t1 = { rr = 3.0, close_pct = 0.0, move_sl_to_breakeven = true }
take_profit_rr = 3.69
cooldown_bars = 2
