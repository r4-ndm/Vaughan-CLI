name = "Gold (xyz:GOLD) 1h — RSI/RSI-MA Turn + KST Regime Filter (1:3.5 R:R)"

[market]
coin = "xyz:GOLD"
interval = "1h"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14, ma_period = 14, ma_type = "sma" }
kst = { r1 = 10, r2 = 15, r3 = 20, r4 = 30, s1 = 10, s2 = 10, s3 = 10, s4 = 15, signal = 9 }
atr = { period = 14 }

# Long: RSI crosses back above its 14-SMA from oversold (<42) while KST momentum regime is bullish.
[entry.long]
all = [
    "rsi crosses_above rsi_ma",
    "rsi_ma < 42.0",
    "kst_line > kst_signal",
]

# Short: RSI crosses back below its 14-SMA from overbought (>58) while KST momentum regime is bearish.
[entry.short]
all = [
    "rsi crosses_below rsi_ma",
    "rsi_ma > 58.0",
    "kst_line < kst_signal",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.5, min_stop_bps = 70, max_stop_bps = 380 }
take_profit_rr = 3.5
cooldown_bars = 2
