name = "WTI Crude Oil (xyz:CL) 30m — Connors RSI Extremes + H4 StochRSI Bias (1:3.5 R:R)"

[market]
coin = "xyz:CL"
interval = "30m"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
connors_rsi = { rsi_period = 3, streak_period = 2, rank_period = 100 }
atr = { period = 14 }

# Higher-timeframe filter: 4h StochRSI built from 1h history so it is warmed up from bar 1.
[indicators.htf]
interval = "4h"
source = "1h"
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }

# Long: Connors RSI deeply oversold (<20) + Wilder RSI (<40) while closed 4h StochRSI is bullish (%K > %D).
[entry.long]
all = [
    "connors_rsi < 20.0",
    "htf_stoch_k > htf_stoch_d",
    "rsi < 40.0",
]

# Short: Connors RSI deeply overbought (>80) + Wilder RSI (>60) while closed 4h StochRSI is bearish (%K < %D).
[entry.short]
all = [
    "connors_rsi > 80.0",
    "htf_stoch_k < htf_stoch_d",
    "rsi > 60.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.5, min_stop_bps = 80, max_stop_bps = 350 }
take_profit_rr = 3.5
cooldown_bars = 2
