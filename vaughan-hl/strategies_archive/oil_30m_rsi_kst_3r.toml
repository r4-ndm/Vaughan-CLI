name = "WTI Crude Oil (xyz:CL) 30m — KST + RSI Momentum Turn + 1:3 R:R"

[market]
coin = "xyz:CL"
interval = "30m"
leverage = 5
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 1.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
kst = { r1 = 10, r2 = 15, r3 = 20, r4 = 30, s1 = 10, s2 = 10, s3 = 10, s4 = 15, signal = 9 }
ema_fast = { period = 21 }
ema_trend = { period = 200 }
adx = { period = 14 }
atr = { period = 14 }

[entry.long]
all = [
    "kst_line crosses_above kst_signal",
    "rsi > 25.0",
    "rsi < 65.0",
]

[entry.short]
all = [
    "kst_line crosses_below kst_signal",
    "rsi < 75.0",
    "rsi > 35.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.0, min_stop_bps = 25, max_stop_bps = 300 }
t1 = { rr = 1.5, close_pct = 50.0, move_sl_to_breakeven = true }
take_profit_rr = 3.0
cooldown_bars = 2
