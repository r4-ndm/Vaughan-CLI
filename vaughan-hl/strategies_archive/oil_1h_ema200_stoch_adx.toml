name = "WTI Crude Oil (xyz:CL) 1h — EMA200 Trend Pullback + StochRSI Cross + ADX>18 (1:3.5 R:R)"

[market]
coin = "xyz:CL"
interval = "1h"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }
ema_trend = { period = 200 }
adx = { period = 14 }
atr = { period = 14 }

[entry.long]
all = [
    "close > ema_trend",
    "rsi < 42.0",
    "stoch_k crosses_above stoch_d",
    "adx > 18.0",
]

[entry.short]
all = [
    "close < ema_trend",
    "rsi > 58.0",
    "stoch_k crosses_below stoch_d",
    "adx > 18.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 3.0, min_stop_bps = 100, max_stop_bps = 350 }
take_profit_rr = 3.5
cooldown_bars = 2
