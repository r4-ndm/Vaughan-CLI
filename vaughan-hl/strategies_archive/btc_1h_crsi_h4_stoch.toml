name = "BTC 1h — ConnorsRSI(20/80) + H4 StochRSI Bias + Wilder RSI(40/60) (1:3.0 R:R)"

[market]
coin = "BTC"
interval = "1h"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
connors_rsi = { rsi_period = 3, streak_period = 2, rank_period = 100 }
atr = { period = 14 }

[indicators.htf]
interval = "4h"
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }

[entry.long]
all = [
    "connors_rsi < 20.0",
    "htf_stoch_k > htf_stoch_d",
    "rsi < 40.0",
]

[entry.short]
all = [
    "connors_rsi > 80.0",
    "htf_stoch_k < htf_stoch_d",
    "rsi > 60.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.5, min_stop_bps = 85, max_stop_bps = 380 }
take_profit_rr = 3.0
cooldown_bars = 2
