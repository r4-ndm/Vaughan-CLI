name = "Gold (xyz:GOLD) 30m — KST + RSI + StochRSI + 1:3 R:R"

[market]
coin = "xyz:GOLD"
interval = "30m"
leverage = 5
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 1.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
kst = { r1 = 10, r2 = 15, r3 = 20, r4 = 30, s1 = 10, s2 = 10, s3 = 10, s4 = 15, signal = 9 }
ema_fast = { period = 21 }
ema_trend = { period = 200 }
adx = { period = 14 }
atr = { period = 14 }

[entry.long]
all = [
    "kst_line > kst_signal",
    "stoch_k crosses_above stoch_d",
    "rsi < 55.0",
    "close > ema_trend",
]

[entry.short]
all = [
    "kst_line < kst_signal",
    "stoch_k crosses_below stoch_d",
    "rsi > 45.0",
    "close < ema_trend",
]

[exit]
stop_loss = { kind = "atr", multiplier = 1.5, min_stop_bps = 25, max_stop_bps = 250 }
t1 = { rr = 1.5, close_pct = 50.0, move_sl_to_breakeven = true }
take_profit_rr = 3.0
cooldown_bars = 2
