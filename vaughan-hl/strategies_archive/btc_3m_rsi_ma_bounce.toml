name = "BTC 3m — RSI/RSI-MA Bounce (re-cross with trend filter) + 1:3 R:R"

[market]
coin = "BTC"
interval = "3m"
leverage = 5
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 1.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14, ma_period = 14, ma_type = "sma" }
ema_trend = { period = 200 }
atr = { period = 14 }

# Long: RSI comes back down to its MA and turns back up, while price holds above the 200 EMA.
[entry.long]
all = [
    "rsi crosses_above rsi_ma",
    "close > ema_trend",
]

# Short: mirror image.
[entry.short]
all = [
    "rsi crosses_below rsi_ma",
    "close < ema_trend",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.0, min_stop_bps = 25, max_stop_bps = 250 }
t1 = { rr = 1.5, close_pct = 50.0, move_sl_to_breakeven = true }
take_profit_rr = 3.0
cooldown_bars = 2
