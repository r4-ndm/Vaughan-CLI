name = "WTI Crude Oil (xyz:CL) 30m — RSI + StochRSI Cross + ADX>18 + 1:3 R:R"

[market]
coin = "xyz:CL"
interval = "30m"
leverage = 5
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 1.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
kst = { r1 = 10, r2 = 15, r3 = 20, r4 = 30, s1 = 10, s2 = 10, s3 = 10, s4 = 15, signal = 9 }
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }
adx = { period = 14 }
atr = { period = 14 }

[entry.long]
all = [
    "rsi < 38.0",
    "stoch_k crosses_above stoch_d",
    "adx > 18.0",
]

[entry.short]
all = [
    "rsi > 62.0",
    "stoch_k crosses_below stoch_d",
    "adx > 18.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.0, min_stop_bps = 25, max_stop_bps = 300 }
take_profit_rr = 3.0
cooldown_bars = 2
