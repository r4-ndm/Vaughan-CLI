[package]
name = "vaughan-hl"
version = "0.1.0"
edition = "2021"
authors = ["Vaughan Team"]
license = "MIT OR Apache-2.0"
description = "Modular Hyperliquid strategy lab, R:R backtester, L1 wire signer, and policy-bound execution engine for Vaughan-CLI"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "vaughan-hl"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "tui"]
# Standalone CLI binary dependencies (`clap`, `anyhow`, `rpassword`, `tracing-subscriber`).
# Omitted when `vaughan-hl` is linked as a library into `Vaughan-CLI`.
cli = ["dep:anyhow", "dep:clap", "dep:rpassword", "dep:tracing-subscriber", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal"]
# Interactive Ratatui terminal dashboard (standalone `vaughan-hl` or embeddable in `vaughan-tui`).
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
# Core & CLI (matches Vaughan-CLI workspace allowlist)
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

# TUI (matches Vaughan-CLI workspace allowlist; gated by `tui` feature, no termwiz/palette bloat)
crossterm = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }

# Security & EIP-712 / L1 Signing (matches Vaughan-CLI workspace allowlist; zero unapproved crates)
alloy = { workspace = true }
alloy-dyn-abi = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rpassword = { workspace = true, optional = true }
secrecy = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
