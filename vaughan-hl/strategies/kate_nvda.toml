name = "kate nvda"

[market]
coin = "xyz:NVDA"
interval = "15m"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
connors_rsi = { rsi_period = 3, streak_period = 2, rank_period = 100 }
atr = { period = 14 }

# Higher-timeframe 4h trend bias filter (borrowed from Bob)
[indicators.htf]
interval = "4h"
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }

[entry.long]
all = [
    "connors_rsi < 20.0",
    "htf_stoch_k > htf_stoch_d",
    "rsi < 40.0",
]

[entry.short]
all = [
    "connors_rsi > 80.0",
    "htf_stoch_k < htf_stoch_d",
    "rsi > 60.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 3.0, min_stop_bps = 75, max_stop_bps = 380 }

# --- MULTI-TARGET CONFIGURATIONS ---
# Option A (Active: Trend Runner): +27.08R Net, 2.35 PF, WF Verified in both H1 (+12.36R) and H2 (+9.08R).
take_profit_rr = 3.5

# Option B (4-Target Split): Un-comment to scale out across 4 targets (1:1, 1:2, 1:3, 1:3.5) with +17.25R.
# targets = [
#     { rr = 1.0, close_pct = 25.0, move_sl_to_breakeven = true },
#     { rr = 2.0, close_pct = 25.0 },
#     { rr = 3.0, close_pct = 25.0 },
#     { rr = 3.5, close_pct = 25.0 },
# ]

# Option C (Bob-Style T1 @ 2.0R): Un-comment to bank 1/3 at 2.0R and trail stop to breakeven.
# t1 = { rr = 2.0, close_pct = 33.3, move_sl_to_breakeven = true }

cooldown_bars = 2
