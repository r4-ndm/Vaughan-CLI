name = "bob eth 3m"

[market]
coin = "ETH"
interval = "3m"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14, ma_period = 14, ma_type = "sma" }
connors_rsi = { rsi_period = 2, streak_period = 4, rank_period = 100 }
ema_trend = { period = 200 }
adx = { period = 14 }
atr = { period = 14 }

[indicators.htf]
interval = "1h"
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }

[entry]
max_losses_per_window = 1

[entry.long]
all = [
    "connors_rsi crosses_above 25.0",
    "rsi > rsi_ma",
    "close > ema_trend",
    "adx > 18.0",
    "plus_di > minus_di",
    "htf_stoch_k > htf_stoch_d",
]

[entry.short]
all = [
    "connors_rsi crosses_below 75.0",
    "rsi < rsi_ma",
    "close < ema_trend",
    "adx > 18.0",
    "minus_di > plus_di",
    "htf_stoch_k < htf_stoch_d",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.0, min_stop_bps = 40, max_stop_bps = 250 }
t1 = { rr = 1.8, close_pct = 33.3, move_sl_to_breakeven = true }
take_profit_rr = 2.5
cooldown_bars = 2
