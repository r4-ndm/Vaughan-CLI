name = "sue sp500"

[market]
coin = "xyz:SP500"
interval = "1h"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
connors_rsi = { rsi_period = 3, streak_period = 2, rank_period = 100 }
bollinger = { period = 20, std_dev = 2.0 }
atr = { period = 14 }

# Long: Price closes below lower Bollinger Band while both ConnorsRSI (<18) and Wilder RSI (<36) confirm exhaustion.
[entry.long]
all = [
    "close < bb_lower",
    "connors_rsi < 18.0",
    "rsi < 36.0",
]

# Short: Price closes above upper Bollinger Band while both ConnorsRSI (>82) and Wilder RSI (>64) confirm exhaustion.
[entry.short]
all = [
    "close > bb_upper",
    "connors_rsi > 82.0",
    "rsi > 64.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 3.0, min_stop_bps = 85, max_stop_bps = 380 }

# --- MULTI-TARGET CONFIGURATIONS ---
# Option A (Active: Mean Reversion Runner): +25.49R Net, 1.92 PF, WF Verified in both H1 (+8.95R) and H2 (+15.40R).
take_profit_rr = 2.5

# Option B (1:1 Partial + Runner): Un-comment to bank 1/3 at 1:1, trail stop to breakeven, and boost Win Rate to 60.3% (+18.55R).
# t1 = { rr = 1.0, close_pct = 33.3, move_sl_to_breakeven = true }

# Option C (4-Target Split): Un-comment to scale out 25% each at 1.0R, 1.5R, 2.0R, and 2.5R.
# targets = [
#     { rr = 1.0, close_pct = 25.0, move_sl_to_breakeven = true },
#     { rr = 1.5, close_pct = 25.0 },
#     { rr = 2.0, close_pct = 25.0 },
#     { rr = 2.5, close_pct = 25.0 },
# ]

cooldown_bars = 2
