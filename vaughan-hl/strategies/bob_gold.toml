name = "bob gold"

[market]
coin = "xyz:GOLD"
interval = "5m"
leverage = 20
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14, ma_period = 14, ma_type = "sma" }
connors_rsi = { rsi_period = 1, streak_period = 4, rank_period = 100 }
ema_trend = { period = 200 }
adx = { period = 14 }
atr = { period = 14 }

# Higher-timeframe 4h trend filter
[indicators.htf]
interval = "4h"
stoch_rsi = { rsi_period = 14, stoch_period = 14, k_smooth = 3, d_smooth = 3 }

[entry]
max_losses_per_window = 1

[entry.long]
all = [
    "connors_rsi crosses_above 30.0",
    "rsi > rsi_ma",
    "close > ema_trend",
    "adx > 20.0",
    "plus_di > minus_di",
    "htf_stoch_k > htf_stoch_d",
    "htf_stoch_k < 50.0",
]

[entry.short]
all = [
    "connors_rsi crosses_below 70.0",
    "rsi < rsi_ma",
    "close < ema_trend",
    "adx > 20.0",
    "minus_di > plus_di",
    "htf_stoch_k < htf_stoch_d",
    "htf_stoch_k > 50.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.0, min_stop_bps = 65, max_stop_bps = 250 }
t1 = { rr = 2.0, close_pct = 33.3, move_sl_to_breakeven = true }
take_profit_rr = 3.15
cooldown_bars = 2
