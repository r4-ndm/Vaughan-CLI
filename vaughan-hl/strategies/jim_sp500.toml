name = "jim sp500"

[market]
coin = "xyz:SP500"
interval = "15m"
leverage = 10
is_cross = false
direction = "both"

[sizing]
mode = "risk_pct"
risk_pct = 2.0
initial_equity_usd = 1000.0

[indicators]
rsi = { period = 14 }
kst = { r1 = 10, r2 = 15, r3 = 20, r4 = 30, s1 = 10, s2 = 10, s3 = 10, s4 = 15, signal = 9 }
adx = { period = 14 }
atr = { period = 14 }

[entry.long]
all = [
    "kst_line crosses_above kst_signal",
    "rsi > 30.0",
    "rsi < 60.0",
    "adx > 18.0",
]

[entry.short]
all = [
    "kst_line crosses_below kst_signal",
    "rsi < 70.0",
    "rsi > 40.0",
    "adx > 18.0",
]

[exit]
stop_loss = { kind = "atr", multiplier = 2.5, min_stop_bps = 50, max_stop_bps = 250 }
take_profit_rr = 4.0
cooldown_bars = 2
