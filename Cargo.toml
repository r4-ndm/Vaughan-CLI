[workspace]
resolver = "2"
members = [
    "crates/wiz4rd-math",
    "crates/wiz4rd-sdk",
    "vaughan-aa",
    "vaughan-agent",
    "vaughan-cli",
    "vaughan-core",
    "vaughan-dapp-browser",
    "vaughan-provider",
    "vaughan-mcp",
    "vaughan-railgun",
    "vaughan-tui",
    "vaughan-hl",
]

[workspace.package]
version = "0.2.6"
edition = "2021"
authors = ["Vaughan Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/r4-ndm/Vaughan-CLI"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Chain / Ethereum. Single Alloy version for the whole workspace.
alloy = { version = "2", default-features = false, features = [
    "std",
    "network",
    "providers",
    "provider-http",
    "reqwest",
    "reqwest-default-tls",
    "signers",
    "signer-local",
    "signer-ledger",
    "rpc-types-eth",
    "consensus",
    "eips",
    "contract",
    "sol-types",
    "rlp",
    "dyn-abi",
    "json",
    "transports",
    "rpc-client",
] }
# EIP-712 dynamic typed-data signing. `alloy`'s top-level `eip712` feature
# also enables optional cloud/ledger signer crates whose published versions
# don't resolve, so we enable the feature on the dyn-abi sub-crate directly.
alloy-dyn-abi = { version = "1.6", features = ["eip712"] }
# Ledger USB signer (Phase 1). eip712 here only — do not enable Alloy top-level eip712.
alloy-signer-ledger = { version = "2", default-features = false, features = ["eip712"] }
# Trezor USB client (Phase 2). CC0-1.0; ethereum only (no bitcoin feature).
trezor-client = { version = "0.1.6", default-features = false, features = ["ethereum"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "io-util", "signal"] }
moka = { version = "0.12", features = ["future"] }

# Provider bridge (Phase 2): local EIP-1193 WebSocket server (loopback only).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = "0.3"

# Security
bip39 = { version = "2", features = ["rand", "zeroize"] }
bip32 = { version = "0.5", default-features = false, features = ["std", "secp256k1"] }
k256 = { version = "0.13", default-features = false, features = ["std", "arithmetic", "ecdsa"] }
argon2 = "0.5"
aes-gcm = "0.10"
secrecy = "0.8"
zeroize = "1"
rand = "0.8"

# Std / util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
dirs = "5"
rustix = { version = "0.38", default-features = false, features = ["process"] }
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls", "stream"] }
uniswap-v3-sdk = { version = "=7.0.0", default-features = false }

# RAILGUN (opt-in `railgun` feature; only `vaughan-railgun` may depend on these).
# Exact-commit pin: bump only via the procedure in `docs/railgun-go-no-go.md`.
railgun-wallet = { git = "https://github.com/triamazikamno/railgun-rust", rev = "95e05b0cc06bb6ee6d0d44d5112540b26da947c3" }
broadcaster-core = { git = "https://github.com/triamazikamno/railgun-rust", rev = "95e05b0cc06bb6ee6d0d44d5112540b26da947c3" }
merkletree = { git = "https://github.com/triamazikamno/railgun-rust", rev = "95e05b0cc06bb6ee6d0d44d5112540b26da947c3" }

# TUI
ratatui = "0.30"
crossterm = "0.28"

# Internal Crates
vaughan-core = { path = "./vaughan-core" }
vaughan-aa = { path = "./vaughan-aa" }
vaughan-agent = { path = "./vaughan-agent" }
vaughan-provider = { path = "./vaughan-provider" }
vaughan-mcp = { path = "./vaughan-mcp" }
vaughan-railgun = { path = "./vaughan-railgun" }
vaughan-hl = { path = "./vaughan-hl" }
wiz4rd-math = { path = "./crates/wiz4rd-math" }
wiz4rd-sdk = { path = "./crates/wiz4rd-sdk" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
