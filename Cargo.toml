[workspace]
resolver = "2"
members = [
    "vaughan-aa",
    "vaughan-agent",
    "vaughan-cli",
    "vaughan-core",
    "vaughan-provider",
    "vaughan-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vaughan Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/r4-ndm/vaughan-cli"

[workspace.dependencies]
# Chain / Ethereum. Single Alloy version for the whole workspace.
alloy = { version = "2", default-features = false, features = [
    "std",
    "network",
    "providers",
    "provider-http",
    "reqwest",
    "reqwest-default-tls",
    "signers",
    "signer-local",
    "rpc-types-eth",
    "consensus",
    "eips",
    "contract",
    "sol-types",
    "rlp",
    "dyn-abi",
    "json",
    "transports",
    "rpc-client",
] }
# EIP-712 dynamic typed-data signing. `alloy`'s top-level `eip712` feature
# also enables optional cloud/ledger signer crates whose published versions
# don't resolve, so we enable the feature on the dyn-abi sub-crate directly.
alloy-dyn-abi = { version = "1.6", features = ["eip712"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "io-util"] }
moka = { version = "0.12", features = ["future"] }

# Provider bridge (Phase 2): local EIP-1193 WebSocket server (loopback only).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = "0.3"

# Security
bip39 = { version = "2", features = ["rand", "zeroize"] }
bip32 = { version = "0.5", default-features = false, features = ["std", "secp256k1"] }
argon2 = "0.5"
aes-gcm = "0.10"
secrecy = "0.8"
zeroize = "1"
rand = "0.8"

# Std / util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
dirs = "5"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls"] }


# TUI
ratatui = "0.29"
crossterm = "0.28"

# Internal Crates
vaughan-core = { path = "./vaughan-core" }
vaughan-aa = { path = "./vaughan-aa" }
vaughan-agent = { path = "./vaughan-agent" }
vaughan-provider = { path = "./vaughan-provider" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
