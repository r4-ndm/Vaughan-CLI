[package]
name = "vaughan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaughan wallet: interactive TUI (default) and scriptable CLI subcommands"
repository = "https://github.com/r4-ndm/Vaughan-CLI"

[lib]
name = "vaughan_cli"
path = "src/lib.rs"

[[bin]]
name = "vaughan"
path = "src/main.rs"

[features]
default = []
# Opt-in RAILGUN shielded balances (see docs/railgun-go-no-go.md).
railgun = ["vaughan-tui/railgun"]

[dependencies]
vaughan-core = { path = "../vaughan-core" }
vaughan-tui = { path = "../vaughan-tui" }
vaughan-agent = { path = "../vaughan-agent" }
vaughan-mcp = { path = "../vaughan-mcp" }
vaughan-aa = { path = "../vaughan-aa" }
rustix = { workspace = true }
alloy = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
