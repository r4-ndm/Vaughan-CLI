[package]
name = "vaughan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaughan wallet: interactive TUI (default) and scriptable CLI subcommands"
repository = "https://github.com/r4-ndm/Vaughan-CLI"

[[bin]]
name = "vaughan"
path = "src/main.rs"

[dependencies]
vaughan-core = { path = "../vaughan-core" }
vaughan-tui = { path = "../vaughan-tui" }
vaughan-agent = { path = "../vaughan-agent" }
vaughan-mcp = { path = "../vaughan-mcp" }
alloy = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
